<main class="login-fondo">
  <section class="login-tarjeta">
    <div class="login-marca">
      <span class="marca-icono">🔧</span>
      <h1>AutoAndes</h1>
      <p>Órdenes de servicio del taller</p>
    </div>

    @if (aviso) {
      <div class="alerta alerta-aviso" role="status">{{ aviso }}</div>
    }
    @if (error(); as mensaje) {
      <div class="alerta alerta-error" role="alert">{{ mensaje }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      <div class="campo">
        <label for="username">Usuario</label>
        <input id="username" class="control" formControlName="username" autocomplete="username" autofocus />
        <app-campo-error [control]="form.controls.username" [mensajes]="{ required: 'Ingrese su usuario' }" />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="control" formControlName="password" autocomplete="current-password" />
        <app-campo-error [control]="form.controls.password" [mensajes]="{ required: 'Ingrese su contraseña' }" />
      </div>
      <button type="submit" class="btn btn-primario btn-bloque" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
